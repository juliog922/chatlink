[project]
name = "chatlink-bot"
version = "0.1.0"
description = "FastAPI client for WhatsApp gRPC server using Whatsmeow"
readme = "README.md"
authors = [
    { name = "Julio Galindo", email = "juliogalindo922@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioodbc>=0.5.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.124.0",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "openpyxl>=3.1.5",
    "pillow>=12.2.0",
    "protobuf>=6.33.2",
    "psutil>=7.2.1",
    "pydantic[email]>=2.12.5",
    "pyodbc>=5.3.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.16.2",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn>=0.38.0",
]

[project.scripts]
chatlink-bot = "chatlink_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatlink_bot"]
