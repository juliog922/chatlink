<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatLink Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      ink:    { 950:'#0B1017', 900:'#0F1620', 800:'#141D29', 700:'#1D2938', 600:'#2A3A4E' },
      line:   '#223146',
      paper:  '#D9E1EA',
      dim:    '#7C8CA0',
      kapa:   { DEFAULT:'#2DD4BF', dim:'#134E48', ink:'#052E2B' },   // the assistant's color
      sales:  '#60A5FA',
      warn:   '#FBBF24',
      bad:    '#F87171',
    },
    fontFamily: {
      sans: ['"IBM Plex Sans"','system-ui','sans-serif'],
      mono: ['"IBM Plex Mono"','ui-monospace','monospace'],
    },
  }},
};
</script>
<style>
  [v-cloak]{display:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0F1620}
  ::-webkit-scrollbar-thumb{background:#2A3A4E;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#3B5068}
  .bubble{max-width:min(85%,42rem)}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body class="bg-ink-950 text-paper h-screen w-screen overflow-hidden font-sans antialiased">
<div id="app" v-cloak class="flex h-full">

  <!-- ============================================================ Login -->
  <div v-if="!isAuthenticated" class="flex-1 flex items-center justify-center">
    <div class="bg-ink-900 p-8 rounded-2xl border border-line w-96">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-kapa-dim text-kapa flex items-center justify-center text-lg font-bold font-mono">K</div>
        <div>
          <h2 class="text-xl font-bold leading-none">ChatLink Console</h2>
          <span class="text-xs text-dim font-mono">Kapa · order assistant ops</span>
        </div>
      </div>
      <div v-if="loginError" class="bg-bad/10 border border-bad/40 text-bad px-3 py-2 rounded-lg text-sm mb-4">
        <i class="fas fa-exclamation-triangle mr-1"></i> {{ loginError }}
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-dim uppercase tracking-wider mb-1">Username</label>
          <input v-model="loginUsername" type="text" class="w-full bg-ink-950 border border-line rounded-lg px-4 py-3 text-sm focus:border-kapa outline-none" @keyup.enter="performLogin">
        </div>
        <div>
          <label class="block text-xs font-semibold text-dim uppercase tracking-wider mb-1">Password</label>
          <input v-model="loginPassword" type="password" class="w-full bg-ink-950 border border-line rounded-lg px-4 py-3 text-sm focus:border-kapa outline-none" @keyup.enter="performLogin">
        </div>
        <button @click="performLogin" class="w-full bg-kapa text-kapa-ink font-bold py-3 rounded-lg hover:brightness-110 transition active:scale-[.98]">
          Sign in
        </button>
      </div>
    </div>
  </div>

  <template v-else>
    <!-- ========================================================= Sidebar -->
    <aside class="w-60 bg-ink-900 flex flex-col border-r border-line">
      <div class="p-5 flex items-center gap-3 border-b border-line">
        <div class="w-9 h-9 rounded-lg bg-kapa-dim text-kapa flex items-center justify-center font-bold font-mono">K</div>
        <div>
          <h1 class="font-bold leading-none">ChatLink</h1>
          <span class="text-[11px] text-dim font-mono">v3.1 · Kapa</span>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <a v-for="item in navItems" :key="item.id" @click="currentView = item.id"
           :class="currentView === item.id ? 'bg-kapa-dim text-kapa' : 'text-dim hover:bg-ink-800 hover:text-paper'"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer transition-colors text-sm font-medium">
          <i :class="item.icon" class="w-5 text-center"></i>{{ item.label }}
        </a>
      </nav>
      <div class="p-3 border-t border-line text-[11px] text-dim font-mono flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full" :class="allHealthy ? 'bg-kapa' : 'bg-warn'"></span>
        {{ allHealthy ? 'all systems ok' : 'check dashboard' }}
      </div>
    </aside>

    <!-- ============================================================ Main -->
    <div class="flex-1 flex flex-col relative">
      <header class="h-14 bg-ink-900/80 backdrop-blur border-b border-line flex items-center justify-between px-6">
        <h2 class="font-bold tracking-wide">{{ pageTitle }}</h2>
        <div class="flex items-center gap-3">
          <span v-if="loading" class="text-kapa text-sm"><i class="fas fa-circle-notch fa-spin mr-2"></i>Working…</span>
          <button @click="refreshAll" class="w-8 h-8 rounded-lg bg-ink-800 hover:bg-ink-700 flex items-center justify-center transition-colors" title="Refresh">
            <i class="fas fa-rotate text-xs"></i>
          </button>
        </div>
      </header>

      <main class="flex-1 overflow-hidden">

        <!-- Dashboard -->
        <div v-if="currentView === 'dashboard'" class="p-6 h-full overflow-y-auto">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div v-for="stat in statusCards" :key="stat.label" class="bg-ink-900 p-5 rounded-xl border border-line">
              <div class="flex items-start justify-between">
                <div>
                  <div class="text-dim text-xs font-semibold uppercase tracking-wider mb-1">{{ stat.label }}</div>
                  <div class="text-lg font-bold flex items-center gap-2" :class="stat.color">
                    <i :class="stat.statusIcon" class="text-sm"></i>{{ stat.value }}
                  </div>
                </div>
                <i :class="stat.icon" class="text-2xl text-ink-600"></i>
              </div>
              <div class="text-xs text-dim mt-3 leading-relaxed">{{ stat.desc }}</div>
            </div>
          </div>

          <!-- ============================== Stored state (Postgres + index) -->
          <div class="mt-6 grid grid-cols-1 lg:grid-cols-3 gap-4">

            <!-- Table row counts -->
            <div class="bg-ink-900 rounded-xl border border-line p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest">Bot database</h3>
                <i class="fas fa-table text-ink-600"></i>
              </div>
              <div v-if="!dbOverview" class="text-xs text-dim">Loading…</div>
              <div v-else class="space-y-2 font-mono text-xs">
                <div v-for="row in dbTableRows" :key="row.key" class="flex items-baseline justify-between gap-3">
                  <span class="text-dim truncate">{{ row.label }}</span>
                  <span v-if="row.count !== null && row.count !== undefined" class="text-paper font-semibold">{{ row.count.toLocaleString() }}</span>
                  <span v-else class="text-bad" :title="row.error">missing</span>
                </div>
              </div>
              <div v-if="missingTables.length" class="text-[10px] text-bad mt-3 leading-snug">
                <i class="fas fa-triangle-exclamation mr-1"></i>
                Not created yet: <b>{{ missingTables.map(r => r.label).join(', ') }}</b> — restart the bot so
                <span class="font-mono">create_all</span> picks up the new models.
              </div>
            </div>

            <!-- Conversation health -->
            <div class="bg-ink-900 rounded-xl border border-line p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest">Conversations</h3>
                <i class="fas fa-comment-dots text-ink-600"></i>
              </div>
              <div v-if="!dbOverview" class="text-xs text-dim">Loading…</div>
              <div v-else class="space-y-2 font-mono text-xs">
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Building an order</span>
                  <span class="font-semibold" :class="(dbOverview.conversaciones.por_estado.BUILDING||0) ? 'text-warn' : 'text-dim'">
                    {{ dbOverview.conversaciones.por_estado.BUILDING || 0 }}
                  </span>
                </div>
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Dispatched (closed)</span>
                  <span class="text-kapa font-semibold">{{ dbOverview.conversaciones.por_estado.CLOSED || 0 }}</span>
                </div>
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Idle</span>
                  <span class="text-paper font-semibold">{{ dbOverview.conversaciones.por_estado.IDLE || 0 }}</span>
                </div>
                <div class="flex items-baseline justify-between border-t border-line pt-2 mt-2">
                  <span class="text-dim">Currently open</span>
                  <span class="text-paper font-semibold">{{ dbOverview.conversaciones.abiertas }}</span>
                </div>
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Opted out of the bot</span>
                  <span class="font-semibold" :class="dbOverview.conversaciones.opt_out ? 'text-bad' : 'text-dim'">
                    {{ dbOverview.conversaciones.opt_out }}
                  </span>
                </div>
              </div>
              <button v-if="dbOverview" @click="currentView='conversations'"
                      class="mt-4 w-full text-xs bg-ink-800 hover:bg-ink-700 py-2 rounded-lg transition-colors">
                Browse conversations <i class="fas fa-arrow-right ml-1"></i>
              </button>
            </div>

            <!-- Search index -->
            <div class="bg-ink-900 rounded-xl border border-line p-5">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest">Product index</h3>
                <i class="fas fa-magnifying-glass text-ink-600"></i>
              </div>
              <div v-if="!dbOverview" class="text-xs text-dim">Loading…</div>
              <div v-else class="space-y-2 font-mono text-xs">
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Vectors (Qdrant)</span>
                  <span class="font-semibold" :class="dbOverview.qdrant.puntos ? 'text-paper' : 'text-bad'">
                    {{ (dbOverview.qdrant.puntos || 0).toLocaleString() }}
                  </span>
                </div>
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Keyword index (BM25)</span>
                  <span class="font-semibold" :class="dbOverview.bm25_cargado ? 'text-kapa' : 'text-warn'">
                    {{ dbOverview.bm25_cargado ? dbOverview.documentos_bm25.toLocaleString() + ' docs' : 'not built' }}
                  </span>
                </div>
                <div class="flex items-baseline justify-between">
                  <span class="text-dim">Collection</span>
                  <span :class="dbOverview.qdrant.collection_exists ? 'text-kapa' : 'text-bad'">
                    {{ dbOverview.qdrant.collection_exists ? 'ready' : 'missing' }}
                  </span>
                </div>
              </div>
              <div v-if="dbOverview && !dbOverview.bm25_cargado" class="text-[10px] text-warn mt-3 leading-snug">
                BM25 is built lazily on the first search. Keyword evidence outweighs vector
                similarity here, so until it exists results will be noticeably worse.
              </div>
              <button v-if="dbOverview" @click="currentView='catalog'"
                      class="mt-4 w-full text-xs bg-ink-800 hover:bg-ink-700 py-2 rounded-lg transition-colors">
                Test a search <i class="fas fa-arrow-right ml-1"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Users -->
        <div v-if="currentView === 'users'" class="p-6 h-full flex flex-col">
          <div class="flex justify-between mb-4">
            <input v-model="userSearch" placeholder="Search name, email or phone…" class="bg-ink-900 border border-line rounded-lg px-4 py-2 text-sm w-72 focus:border-kapa outline-none">
            <button @click="showAddUserModal=true" class="bg-kapa text-kapa-ink px-4 py-2 rounded-lg text-sm font-bold hover:brightness-110 transition">
              <i class="fas fa-plus mr-2"></i>New user
            </button>
          </div>
          <div class="flex-1 bg-ink-900 rounded-xl border border-line overflow-auto">
            <table class="w-full text-sm text-left text-dim">
              <thead class="text-xs uppercase bg-ink-950/60 text-dim sticky top-0">
                <tr>
                  <th class="px-6 py-3">User</th><th class="px-6 py-3">Role</th>
                  <th class="px-6 py-3">Status</th><th class="px-6 py-3">Gmail</th>
                  <th class="px-6 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="user in filteredUsers" :key="user.id" class="border-t border-line/60 hover:bg-ink-800/40">
                  <td class="px-6 py-3">
                    <div class="font-semibold text-paper">{{ user.name }}</div>
                    <div class="text-xs font-mono">{{ user.email }} · {{ user.phone }}</div>
                  </td>
                  <td class="px-6 py-3">
                    <span class="px-2 py-0.5 rounded text-[11px] uppercase font-bold border"
                          :class="user.role==='admin' ? 'text-warn border-warn/40 bg-warn/10' : 'text-sales border-sales/40 bg-sales/10'">
                      {{ user.role }}
                    </span>
                  </td>
                  <td class="px-6 py-3">
                    <span class="inline-flex items-center gap-2">
                      <span class="w-2 h-2 rounded-full" :class="user.enabled ? 'bg-kapa' : 'bg-ink-600'"></span>
                      {{ user.enabled ? 'Active' : 'Disabled' }}
                    </span>
                  </td>
                  <td class="px-6 py-3">
                    <span :class="user.has_gmail_password ? 'text-kapa' : 'text-dim'" class="text-xs">
                      <i :class="user.has_gmail_password ? 'fas fa-key' : 'fas fa-minus'" class="mr-1"></i>{{ user.has_gmail_password ? 'Configured' : 'No password' }}
                    </span>
                  </td>
                  <td class="px-6 py-3 text-right space-x-1 whitespace-nowrap">
                    <button @click="loginUser(user)" class="p-2 hover:text-kapa transition-colors" title="Link WhatsApp device"><i class="fas fa-link"></i></button>
                    <button v-if="user.role === 'user'" @click="openPasswordModal(user)" class="p-2 hover:text-warn transition-colors" title="Set Gmail app password"><i class="fas fa-key"></i></button>
                    <button @click="deleteUser(user.id)" class="p-2 hover:text-bad transition-colors" title="Delete user"><i class="fas fa-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Connections -->
        <div v-if="currentView === 'connections'" class="p-6 h-full flex flex-col">
          <div class="flex-1 bg-ink-900 rounded-xl border border-line overflow-auto">
            <table class="w-full text-sm text-left text-dim">
              <thead class="text-xs uppercase bg-ink-950/60 sticky top-0">
                <tr><th class="px-6 py-3">Salesman</th><th class="px-6 py-3 text-center">WhatsApp device</th><th class="px-6 py-3 text-center">Mailbox polling</th></tr>
              </thead>
              <tbody>
                <tr v-if="connections.length === 0"><td colspan="3" class="px-6 py-10 text-center text-dim italic">No users enabled yet. Link a device from User Management.</td></tr>
                <tr v-for="conn in connections" :key="conn.user_id" class="border-t border-line/60 hover:bg-ink-800/40">
                  <td class="px-6 py-3">
                    <div class="font-semibold text-paper">{{ conn.name }}</div>
                    <div class="text-xs font-mono">{{ conn.email }} · {{ conn.phone }}</div>
                  </td>
                  <td class="px-6 py-3 text-center">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border"
                          :class="conn.whatsapp_connected ? 'text-kapa border-kapa/40 bg-kapa/10' : 'text-dim border-line bg-ink-950'">
                      <span class="w-1.5 h-1.5 rounded-full" :class="conn.whatsapp_connected ? 'bg-kapa' : 'bg-ink-600'"></span>
                      {{ conn.whatsapp_connected ? 'Linked' : 'Not linked' }}
                    </span>
                  </td>
                  <td class="px-6 py-3 text-center">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border"
                          :class="conn.email_connected ? 'text-sales border-sales/40 bg-sales/10' : 'text-dim border-line bg-ink-950'">
                      <span class="w-1.5 h-1.5 rounded-full" :class="conn.email_connected ? 'bg-sales' : 'bg-ink-600'"></span>
                      {{ conn.email_connected ? 'Listening' : 'Inactive' }}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- ====================================================== Simulator -->
        <div v-if="currentView === 'simulator'" class="h-full flex flex-col md:flex-row md:divide-x divide-line">

          <!-- Settings + conversation state -->
          <div class="md:w-80 shrink-0 bg-ink-900/60 p-5 overflow-y-auto space-y-5">
            <div>
              <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-3">Scenario</h3>
              <div class="space-y-3">
                <div>
                  <label class="block text-xs text-dim mb-1">Mode</label>
                  <select v-model="sim.mode" class="w-full bg-ink-950 border border-line rounded-lg p-2 text-sm focus:border-kapa outline-none">
                    <option value="logic">Logic — all fake, instant replies</option>
                    <option value="channel">Channel — real phone/email as client</option>
                  </select>
                  <div class="text-[10px] text-dim mt-1 leading-snug">{{ modeHelp }}</div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-dim mb-1">Channel</label>
                    <select v-model="sim.channel" class="w-full bg-ink-950 border border-line rounded-lg p-2 text-sm focus:border-kapa outline-none">
                      <option value="whatsapp">WhatsApp</option>
                      <option value="email">Email</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs text-dim mb-1">Attachment</label>
                    <select v-model="sim.media_type" class="w-full bg-ink-950 border border-line rounded-lg p-2 text-sm focus:border-kapa outline-none">
                      <option value="text">None</option>
                      <option value="image">Image (PNG)</option>
                      <option value="document">Document (PDF)</option>
                      <option value="audio">Audio (WAV)</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label class="block text-xs text-dim mb-1">Client (sender)</label>
                  <select v-model="sim.sender" class="w-full bg-ink-950 border border-line rounded-lg p-2 text-sm font-mono focus:border-kapa outline-none">
                    <option value="" disabled>Select actor…</option>
                    <optgroup label="Test clients (cache)" v-if="simClients.length">
                      <option v-for="c in simClients" :value="c.identifier">{{ c.name }} ({{ c.identifier }})</option>
                    </optgroup>
                    <optgroup label="Real clients (SAGE)">
                      <option v-for="a in simActors.filter(x => x.type === 'client')" :value="a.id">{{ a.name }} ({{ a.id }})</option>
                    </optgroup>
                    <optgroup label="Strangers (gatekeeper tests)">
                      <option v-for="a in simActors.filter(x => x.type === 'non_client')" :value="a.id">{{ a.name }}</option>
                    </optgroup>
                    <optgroup label="Internal staff">
                      <option v-for="a in simActors.filter(x => ['admin','user'].includes(x.type))" :value="a.id">{{ a.name }}</option>
                    </optgroup>
                  </select>
                  <div v-if="isNonClientSender" class="text-[10px] mt-1" :class="sim.mock_client_force ? 'text-kapa' : 'text-bad'">
                    <i :class="sim.mock_client_force ? 'fas fa-mask' : 'fas fa-shield-halved'" class="mr-1"></i>
                    {{ sim.mock_client_force ? 'Unknown sender will be faked as a client.' : 'Gatekeeper will DROP this message.' }}
                  </div>
                </div>
                <div>
                  <label class="block text-xs text-dim mb-1">Salesman (receiver) <span class="text-ink-600">optional</span></label>
                  <select v-model="sim.receiver" class="w-full bg-ink-950 border border-line rounded-lg p-2 text-sm font-mono focus:border-kapa outline-none">
                    <option value="">Default: Sim Salesman</option>
                    <option v-for="a in availableReceivers" :value="a.id">{{ a.name }}</option>
                  </select>
                  <div v-if="sim.mode === 'channel' && !sim.receiver" class="text-[10px] text-warn mt-1">Channel mode needs a linked receiver for the reply to really send.</div>
                </div>
                <label class="flex items-center gap-2 text-xs text-dim cursor-pointer select-none">
                  <input type="checkbox" v-model="sim.mock_client_force" class="accent-kapa">
                  Fake client if not in SAGE
                </label>
              </div>
            </div>

            <div class="bg-ink-950/70 border border-line rounded-lg p-3 text-[11px] leading-snug">
              <div class="font-bold text-dim mb-1">
                <i class="fas fa-mobile-screen mr-1"></i>Full mode (self-chat)
                <span class="ml-1 font-mono" :class="simModes.full_mode_ready ? 'text-kapa' : 'text-warn'">{{ simModes.full_mode_ready ? 'READY' : 'NO DEVICE' }}</span>
              </div>
              <div class="text-dim">{{ simModes.full_mode_hint }}</div>
            </div>

            <!-- Conversation state (persisted session) -->
            <div class="bg-ink-950 border border-line rounded-lg p-4 space-y-2 font-mono text-xs">
              <div class="flex items-center justify-between border-b border-line pb-2 mb-1">
                <span class="font-bold text-kapa uppercase tracking-wider">Conversation state</span>
                <button @click="loadSimChat" class="text-dim hover:text-kapa" title="Refresh"><i class="fas fa-rotate"></i></button>
              </div>
              <div class="flex justify-between"><span class="text-dim">Order</span>
                <span :class="{'text-dim': simState.order_status==='IDLE','text-warn': simState.order_status==='BUILDING','text-kapa': simState.order_status==='CLOSED'}">{{ simState.order_status || '—' }}</span>
              </div>
              <div class="flex justify-between"><span class="text-dim">Bot</span>
                <span :class="simState.bot_enabled ? 'text-kapa' : 'text-bad'">{{ simState.bot_enabled ? 'enabled' : 'OPTED OUT' }}</span>
              </div>
              <div class="flex justify-between"><span class="text-dim">Last turn</span><span class="text-paper">{{ simState.last_benchmark_ms }} ms</span></div>

              <!-- Context window occupancy: gauge relative to the FULL window,
                   with a tick at the trim budget (default 70%). Crossing the
                   tick means history is being trimmed and Memoria is carrying
                   the older context — exactly the trigger being monitored. -->
              <div v-if="ctxGauge" class="border-t border-line pt-2">
                <div class="flex justify-between mb-1">
                  <span class="text-dim">Context</span>
                  <span :class="ctxGauge.color">{{ ctxGauge.used }} / {{ ctxGauge.window }} tok · {{ ctxGauge.pct }}%</span>
                </div>
                <div class="relative h-2 bg-ink-950 rounded overflow-hidden">
                  <div class="absolute inset-y-0 left-0 rounded transition-all duration-500"
                       :class="ctxGauge.bar" :style="{ width: Math.min(ctxGauge.pct, 100) + '%' }"></div>
                  <div class="absolute inset-y-0 w-px bg-paper/50" :style="{ left: ctxGauge.budgetPct + '%' }"
                       :title="'Trim budget: ' + ctxGauge.budgetPct + '%'"></div>
                </div>

              <input v-model="convFilter.q" @keyup.enter="loadConversations" placeholder="Client or salesman… (Enter)"
                     class="flex-1 bg-ink-900 border border-line rounded-lg px-3 py-2 text-sm font-mono focus:border-kapa outline-none">
              <button @click="loadConversations" class="bg-ink-800 hover:bg-ink-700 px-4 rounded-lg transition"><i class="fas fa-magnifying-glass"></i></button>
            </div>
            <label class="flex items-center gap-2 text-xs text-dim cursor-pointer">
              <input type="checkbox" v-model="convFilter.solo_abiertas" class="accent-kapa">
              Only conversations currently open
            </label>

            <div class="flex-1 bg-ink-900 rounded-xl border border-line overflow-auto">
              <table class="w-full text-sm text-left text-dim">
                <thead class="text-xs uppercase bg-ink-950/60 sticky top-0">
                  <tr>
                    <th class="px-4 py-3">Client</th><th class="px-4 py-3">Status</th>
                    <th class="px-4 py-3 text-center">Cart</th><th class="px-4 py-3 text-center">Queue</th>
                    <th class="px-4 py-3">Activity</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-if="!conversations.length"><td colspan="5" class="px-4 py-8 text-center">
                    No conversations match. Kapa creates a session the first time a debounce fires for a chat.
                  </td></tr>
                  <tr v-for="c in conversations" :key="c.id" @click="openConv(c)"
                      :class="selectedConv && selectedConv.id === c.id ? 'bg-kapa-dim/30' : 'hover:bg-ink-800/40'"
                      class="border-t border-line/60 cursor-pointer transition-colors">
                    <td class="px-4 py-3">
                      <div class="font-mono text-paper text-xs flex items-center gap-2">
                        <i :class="c.channel === 'whatsapp' ? 'fab fa-whatsapp text-kapa' : 'fas fa-envelope text-sales'"></i>
                        {{ c.client_id }}
                      </div>
                      <div class="text-[10px] font-mono">→ {{ c.user_id }}</div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-mono text-xs font-bold" :class="statusTone(c.order_status)">{{ c.order_status }}</div>
                      <div class="text-[10px] flex gap-1.5 mt-0.5">
                        <span v-if="c.conv_open" class="text-kapa">open</span>
                        <span v-if="!c.bot_enabled" class="text-bad">opt-out</span>
                      </div>
                    </td>
                    <td class="px-4 py-3 text-center font-mono" :class="c.n_cart ? 'text-paper' : ''">{{ c.n_cart }}</td>
                    <td class="px-4 py-3 text-center font-mono" :class="c.n_open_items ? 'text-warn' : ''">{{ c.n_open_items }}</td>
                    <td class="px-4 py-3 text-[10px] font-mono">{{ c.updated_at ? new Date(c.updated_at).toLocaleString() : '—' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Detail -->
          <div class="flex-1 overflow-y-auto p-5">
            <div v-if="!selectedConv" class="h-full flex items-center justify-center text-dim text-sm">
              <div class="text-center">
                <i class="fas fa-hand-pointer text-3xl text-ink-600 mb-3 block"></i>
                Pick a conversation to see its cart, its unresolved queue and its message history.
              </div>
            </div>
            <div v-else class="space-y-4">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <div class="font-mono text-paper">{{ selectedConv.client_id }}</div>
                  <div class="text-xs text-dim font-mono">salesman {{ selectedConv.user_id }} · {{ selectedConv.channel }}</div>
                </div>
                <button @click="resetConv(selectedConv)"
                        class="text-xs border border-bad/40 text-bad hover:bg-bad/10 px-3 py-2 rounded-lg transition-colors shrink-0">
                  <i class="fas fa-eraser mr-1"></i>Reset state
                </button>
              </div>

              <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs font-mono">
                <div class="bg-ink-900 border border-line rounded-lg p-3">
                  <div class="text-dim text-[10px] uppercase tracking-wider">Order</div>
                  <div class="font-bold" :class="statusTone(selectedConv.order_status)">{{ selectedConv.order_status }}</div>
                </div>
                <div class="bg-ink-900 border border-line rounded-lg p-3">
                  <div class="text-dim text-[10px] uppercase tracking-wider">Conversation</div>
                  <div :class="selectedConv.conv_open ? 'text-kapa' : 'text-dim'">{{ selectedConv.conv_open ? 'open' : 'ended' }}</div>
                </div>
                <div class="bg-ink-900 border border-line rounded-lg p-3">
                  <div class="text-dim text-[10px] uppercase tracking-wider">Bot</div>
                  <div :class="selectedConv.bot_enabled ? 'text-kapa' : 'text-bad'">{{ selectedConv.bot_enabled ? 'enabled' : 'opted out' }}</div>
                </div>
                <div class="bg-ink-900 border border-line rounded-lg p-3">
                  <div class="text-dim text-[10px] uppercase tracking-wider">Introduced</div>
                  <div :class="selectedConv.bot_introduced_at ? 'text-paper' : 'text-dim'">{{ selectedConv.bot_introduced_at ? 'yes' : 'never' }}</div>
                </div>
              </div>

              <!-- Cart -->
              <div class="bg-ink-900 border border-line rounded-xl p-4">
                <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-3">
                  Confirmed cart <span class="text-paper">({{ selectedConv.cart.length }})</span>
                </h3>
                <div v-if="!selectedConv.cart.length" class="text-xs text-dim">Empty.</div>
                <table v-else class="w-full text-xs font-mono">
                  <tr v-for="(it, i) in selectedConv.cart" :key="i" class="border-t border-line/40 first:border-0">
                    <td class="py-2 text-kapa w-32">{{ it.code }}</td>
                    <td class="py-2 text-dim">{{ articleName(it.code) || '—' }}</td>
                    <td class="py-2 text-right text-paper w-12">×{{ it.qty }}</td>
                  </tr>
                </table>
              </div>

              <!-- Unresolved queue -->
              <div class="bg-ink-900 border border-line rounded-xl p-4">
                <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-3">
                  Unresolved queue <span :class="selectedConv.open_items.length ? 'text-warn' : 'text-paper'">({{ selectedConv.open_items.length }})</span>
                </h3>
                <div v-if="!selectedConv.open_items.length" class="text-xs text-dim">Nothing pending.</div>
                <div v-else class="space-y-2">
                  <div v-for="(item, i) in selectedConv.open_items" :key="i" class="bg-ink-950 border border-line/60 rounded-lg p-3">
                    <div class="flex items-center gap-2 text-xs">
                      <span class="font-mono text-paper">{{ item.pedido }}</span>
                      <span v-if="item.estado" class="text-[10px] px-1.5 py-0.5 rounded bg-ink-700 text-dim">{{ item.estado }}</span>
                    </div>
                    <div v-if="item.opciones && item.opciones.length" class="mt-2 space-y-1">
                      <div v-for="(o, j) in item.opciones" :key="j" class="text-[11px] font-mono text-dim">
                        <span class="text-kapa">{{ o.codigo }}</span> · {{ o.nombre }}<span v-if="o.marca"> · {{ o.marca }}</span>
                      </div>
                    </div>
                    <div v-if="item.sin_coincidencia" class="mt-2 text-[10px] text-warn">
                      no option contains: {{ item.sin_coincidencia.join(', ') }}
                    </div>
                  </div>
                </div>
              </div>

              <!-- Memory + last dispatched -->
              <div class="grid md:grid-cols-2 gap-4">
                <div class="bg-ink-900 border border-line rounded-xl p-4">
                  <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-2">Memory note</h3>
                  <div class="text-xs leading-relaxed" :class="selectedConv.summary ? 'text-paper' : 'text-dim'">
                    {{ selectedConv.summary || 'Empty.' }}
                  </div>
                </div>
                <div class="bg-ink-900 border border-line rounded-xl p-4">
                  <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-2">
                    Last dispatched order <span class="text-paper">({{ selectedConv.last_closed_cart.length }})</span>
                  </h3>
                  <div v-if="!selectedConv.last_closed_cart.length" class="text-xs text-dim">None yet.</div>
                  <div v-else class="text-xs font-mono space-y-1">
                    <div v-for="(it, i) in selectedConv.last_closed_cart" :key="i" class="flex justify-between">
                      <span class="text-kapa">{{ it.code }}</span><span class="text-paper">×{{ it.qty }}</span>
                    </div>
                  </div>
                  <div class="text-[10px] text-dim mt-2 leading-snug">This is what grounds "ponme lo mismo que la última vez".</div>
                </div>
              </div>

              <!-- Messages -->
              <div class="bg-ink-900 border border-line rounded-xl p-4">
                <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-3">Message history</h3>
                <div v-if="!convMessages.length" class="text-xs text-dim">No stored messages.</div>
                <div v-else class="space-y-2 max-h-96 overflow-y-auto pr-1">
                  <div v-for="m in convMessages" :key="m.id" class="flex" :class="m.direction === 'received' ? 'justify-start' : 'justify-end'">
                    <div class="bubble rounded-xl px-3 py-2 text-xs leading-relaxed"
                         :class="m.is_bot ? 'bg-kapa-dim text-paper' : m.direction === 'received' ? 'bg-ink-800' : 'bg-sales/20'">
                      <div class="whitespace-pre-wrap break-words">{{ m.message }}</div>
                      <div class="text-[9px] text-dim mt-1 font-mono">
                        {{ m.is_bot ? 'Kapa' : m.direction === 'received' ? 'client' : 'salesman' }} ·
                        {{ new Date(m.timestamp).toLocaleString() }}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ==================================================== Catalog search -->
        <div v-if="currentView === 'catalog'" class="p-6 h-full overflow-y-auto">
          <div class="flex items-start gap-2 text-xs text-dim leading-snug mb-4">
            <i class="fas fa-crosshairs text-kapa mt-0.5"></i>
            <span>Runs the <b class="text-paper">real retrieval path</b> and shows exactly what the agent receives.
            Type what a client would type. The tokens and the coverage flags are the two signals that decide
            between committing an item and asking about it.</span>
          </div>

          <div class="flex flex-col md:flex-row gap-2 mb-5">
            <input v-model="catalogQuery" @keyup.enter="searchCatalog" placeholder="e.g. champu de coco 400ml  ·  KG001399  ·  mascarilla antiedad"
                   class="flex-1 bg-ink-900 border border-line rounded-lg px-4 py-3 text-sm font-mono focus:border-kapa outline-none">
            <select v-model.number="catalogTopK" class="bg-ink-900 border border-line rounded-lg px-3 py-3 text-sm focus:border-kapa outline-none">
              <option :value="3">top 3</option><option :value="5">top 5</option>
              <option :value="10">top 10</option><option :value="25">top 25</option>
            </select>
            <button @click="searchCatalog" class="bg-kapa text-kapa-ink px-6 py-3 rounded-lg text-sm font-bold hover:brightness-110 transition">
              <i class="fas fa-magnifying-glass mr-2"></i>Search
            </button>
            <button @click="reingestCatalog" class="bg-ink-800 hover:bg-ink-700 px-4 py-3 rounded-lg text-sm transition-colors" title="Re-sync SAGE → Qdrant">
              <i class="fas fa-rotate"></i>
            </button>
          </div>

          <div v-if="!catalogResult" class="text-center text-dim text-sm py-16">
            <i class="fas fa-magnifying-glass-chart text-3xl text-ink-600 mb-3 block"></i>
            Nothing searched yet.
          </div>

          <div v-else class="space-y-4">
            <!-- The "why" panel -->
            <div class="bg-ink-900 border border-line rounded-xl p-4">
              <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-3">How the query was read</h3>
              <div class="flex flex-wrap items-center gap-2 mb-3">
                <span class="text-xs text-dim">tokens:</span>
                <span v-if="!catalogResult.tokens.length" class="text-xs text-bad">none — every word was dropped as a stopword, a unit or too short</span>
                <span v-for="t in catalogResult.tokens" :key="t" class="font-mono text-xs bg-ink-800 text-paper px-2 py-0.5 rounded">{{ t }}</span>
              </div>
              <div v-if="catalogResult.tokens.length" class="space-y-1">
                <div v-for="t in catalogResult.tokens" :key="'v'+t" class="text-[11px] font-mono text-dim">
                  <span class="text-paper">{{ t }}</span> → {{ catalogResult.variantes[t].join(', ') }}
                </div>
              </div>
              <div v-if="catalogResult.sin_coincidencia.length" class="mt-3 text-xs text-warn">
                <i class="fas fa-triangle-exclamation mr-1"></i>
                No result contains: <b>{{ catalogResult.sin_coincidencia.join(', ') }}</b> — the agent is told to say so
                instead of substituting something.
              </div>
              <div v-if="!catalogResult.bm25_cargado" class="mt-3 text-xs text-bad">
                <i class="fas fa-triangle-exclamation mr-1"></i>BM25 was not loaded for this query.
              </div>
            </div>

            <!-- Results -->
            <div class="bg-ink-900 rounded-xl border border-line overflow-auto">
              <table class="w-full text-sm text-left text-dim">
                <thead class="text-xs uppercase bg-ink-950/60 sticky top-0">
                  <tr>
                    <th class="px-4 py-3">Code</th><th class="px-4 py-3">Product</th>
                    <th class="px-4 py-3">Brand</th><th class="px-4 py-3 text-right">Score</th>
                    <th class="px-4 py-3">Coverage</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-if="!catalogResult.resultados.length"><td colspan="5" class="px-4 py-8 text-center">
                    No hits. The agent would ask for a brand, more detail, or the product code.
                  </td></tr>
                  <tr v-for="r in catalogResult.resultados" :key="r.codigo" class="border-t border-line/60 hover:bg-ink-800/40">
                    <td class="px-4 py-3 font-mono text-kapa text-xs">{{ r.codigo }}</td>
                    <td class="px-4 py-3">
                      <div class="text-paper text-xs">{{ r.nombre }}</div>
                      <div v-if="r.linea" class="text-[10px]">{{ r.linea }}</div>
                    </td>
                    <td class="px-4 py-3 text-xs font-mono">{{ r.marca || '—' }}</td>
                    <td class="px-4 py-3 text-right font-mono text-xs" :class="r.score >= 2 ? 'text-kapa font-bold' : 'text-paper'">
                      {{ r.score }}<span v-if="r.score >= 2" class="text-[9px] block text-kapa">exact code</span>
                    </td>
                    <td class="px-4 py-3">
                      <span v-if="r.cubre_consulta" class="text-[10px] bg-kapa-dim text-kapa px-2 py-0.5 rounded font-bold">covers all</span>
                      <span v-else class="text-[10px] text-dim">partial</span>
                      <div v-if="r.no_cubre.length" class="text-[10px] text-warn mt-1">misses: {{ r.no_cubre.join(', ') }}</div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ==================================================== Client history -->
        <div v-if="currentView === 'clienthistory'" class="p-6 h-full overflow-y-auto">
          <div class="flex items-start gap-2 text-xs text-dim leading-snug mb-4">
            <i class="fas fa-clock-rotate-left text-kapa mt-0.5"></i>
            <span>Resolves informal wording against <b class="text-paper">what this client has actually bought</b>
            (SAGE order tables). Deterministic token coverage — no embeddings, no LLM. Nothing here is wired into
            the conversation flow yet: this is the measurement step. <b class="text-paper">Test clients work too</b>
            once you seed them a fake history under “Test clients”.</span>
          </div>

          <div class="flex flex-col md:flex-row gap-2 mb-5">
            <input v-model="histIdentifier" @keyup.enter="resolveIdentity" placeholder="Client phone or email…"
                   class="flex-1 bg-ink-900 border border-line rounded-lg px-4 py-3 text-sm font-mono focus:border-kapa outline-none">
            <button @click="resolveIdentity" class="bg-kapa text-kapa-ink px-6 py-3 rounded-lg text-sm font-bold hover:brightness-110 transition">
              <i class="fas fa-id-card mr-2"></i>Resolve identity
            </button>
          </div>

          <!-- Identity card: the gate for everything below -->
          <div v-if="histIdentity" class="bg-ink-900 border border-line rounded-xl p-4 mb-4"
               :class="histIdentity.historial_permitido ? 'border-l-4 border-l-kapa' : 'border-l-4 border-l-bad'">
            <div class="flex flex-wrap items-start justify-between gap-4">
              <div>
                <div class="text-paper font-semibold">{{ histIdentity.nombre || 'Unknown name' }}</div>
                <div class="text-xs font-mono text-dim mt-0.5">
                  code {{ histIdentity.codigo_cliente || '—' }} · matched by {{ histIdentity.tipo_coincidencia }} · source {{ histIdentity.origen }}
                </div>
              </div>
              <div class="text-right">
                <div class="text-xs font-bold" :class="histIdentity.inequivoco ? 'text-kapa' : 'text-bad'">
                  <i :class="histIdentity.inequivoco ? 'fas fa-circle-check' : 'fas fa-triangle-exclamation'" class="mr-1"></i>
                  {{ histIdentity.inequivoco ? 'UNAMBIGUOUS' : 'AMBIGUOUS' }}
                </div>
                <div class="text-[10px] text-dim mt-1">
                  {{ histIdentity.historial_permitido ? 'history layer active' : 'history layer OFF' }}
                </div>
              </div>
            </div>
            <div v-if="!histIdentity.inequivoco && histIdentity.codigos_candidatos.length > 1"
                 class="mt-3 text-xs text-bad leading-snug">
              This identifier maps to several client codes
              (<span class="font-mono">{{ histIdentity.codigos_candidatos.join(', ') }}</span>).
              Reading one client's history for another is exactly the failure this guard exists to prevent, so the
              layer stays off and the bot falls back to the catalog.
            </div>
            <div v-if="histIdentity.sincronizacion" class="mt-3 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-2 text-xs font-mono">
              <div><div class="text-dim text-[10px] uppercase">Status</div><div :class="histIdentity.sincronizacion.status === 'error' ? 'text-bad' : 'text-paper'">{{ histIdentity.sincronizacion.status }}</div></div>
              <div><div class="text-dim text-[10px] uppercase">Orders</div><div class="text-paper">{{ histIdentity.sincronizacion.n_orders }}</div></div>
              <div><div class="text-dim text-[10px] uppercase">Lines</div><div class="text-paper">{{ histIdentity.sincronizacion.n_lines }}</div></div>
              <div><div class="text-dim text-[10px] uppercase">Sellable</div><div class="text-kapa">{{ histIdentity.sincronizacion.n_products }}</div></div>
              <div><div class="text-dim text-[10px] uppercase">Excluded</div><div :class="histIdentity.sincronizacion.n_excluded > histIdentity.sincronizacion.n_products ? 'text-bad' : 'text-warn'">{{ histIdentity.sincronizacion.n_excluded }}</div></div>
              <div><div class="text-dim text-[10px] uppercase">Client refs</div><div :class="histIdentity.sincronizacion.n_ref_cliente ? 'text-kapa' : 'text-dim'">{{ histIdentity.sincronizacion.n_ref_cliente }}</div></div>
              <div><div class="text-dim text-[10px] uppercase">Join</div><div :class="histIdentity.sincronizacion.tolerant_join ? 'text-warn' : 'text-paper'">{{ histIdentity.sincronizacion.tolerant_join ? 'tolerant' : 'strict' }}</div></div>
            </div>
            <div v-if="histIdentity.sincronizacion && histIdentity.sincronizacion.n_excluded > histIdentity.sincronizacion.n_products"
                 class="mt-3 text-xs text-bad leading-snug">
              <i class="fas fa-triangle-exclamation mr-1"></i>
              More articles excluded than sellable — the <span class="font-mono">K_BOT = 0</span> assumption is
              probably inverted for this catalog. Flip <span class="font-mono">BOT_VISIBLE_K</span> in ai/rag.py.
            </div>
            <div v-if="histIdentity.sincronizacion && histIdentity.sincronizacion.tolerant_join"
                 class="mt-2 text-xs text-warn leading-snug">
              <i class="fas fa-triangle-exclamation mr-1"></i>
              The strict 4-column join returned nothing and the COALESCE retry worked — SeriePedido is inconsistent
              between CabeceraPedidoCliente and LineasPedidoCliente.
            </div>
            <div v-if="histIdentity.sincronizacion && histIdentity.sincronizacion.error" class="mt-2 text-xs text-bad font-mono">
              {{ histIdentity.sincronizacion.error }}
            </div>
          </div>

          <div v-if="histIdentity && histIdentity.historial_permitido" class="grid lg:grid-cols-2 gap-4">

            <!-- Resolve mentions -->
            <div class="bg-ink-900 border border-line rounded-xl p-4">
              <h3 class="text-[11px] font-bold uppercase text-dim tracking-widest mb-3">Resolve informal mentions</h3>
              <textarea v-model="histMentions" rows="5" placeholder="One mention per line, exactly as a client would say it:&#10;el shampoo de coco&#10;la mascarilla esa de 8 gr&#10;rimel negro"
                        class="w-full bg-ink-950 border border-line rounded-lg px-3 py-2 text-sm font-mono focus:border-kapa outline-none resize-y"></textarea>
              <button @click="resolveMentions" :disabled="!mentionList.length"
                      class="mt-2 w-full bg-kapa text-kapa-ink py-2.5 rounded-lg text-sm font-bold hover:brightness-110 transition disabled:opacity-40 disabled:cursor-not-allowed">
                Resolve {{ mentionList.length || '' }} mention<span v-if="mentionList.length !== 1">s</span>
              </button>

              <div v-if="histResolution" class="mt-4">
                <div class="flex flex-wrap gap-3 text-xs font-mono border-b border-line pb-3 mb-3">
                  <span class="text-dim">resolved rate</span>
                  <span class="text-kapa font-bold">{{ Math.round(histResolution.resumen.tasa_resueltos * 100) }}%</span>
                  <span class="text-dim">·</span>
                  <span v-for="(n, v) in histResolution.resumen.por_veredicto" :key="v" :class="verdictTone(v)">{{ v }} {{ n }}</span>
                </div>
                <div class="space-y-2 max-h-[28rem] overflow-y-auto pr-1">
                  <div v-for="(r, i) in histResolution.resoluciones" :key="i" class="bg-ink-950 border border-line/60 rounded-lg p-3">
                    <div class="flex items-start justify-between gap-3">
                      <div class="text-xs text-paper">"{{ r.consulta }}"</div>
                      <div class="text-[10px] font-bold uppercase shrink-0" :class="verdictTone(r.veredicto)">{{ r.veredicto }}</div>
                    </div>
                    <div class="text-[10px] text-dim mt-1">{{ verdictHelp(r.veredicto) }}</div>
                    <div class="flex flex-wrap gap-1 mt-2">
                      <span v-for="t in r.tokens" :key="t" class="font-mono text-[10px] bg-ink-800 text-dim px-1.5 rounded">{{ t }}</span>
                    </div>
                    <div v-if="r.candidatos.length" class="mt-2 space-y-1">
                      <div v-for="(c, j) in r.candidatos" :key="j" class="text-[11px] font-mono flex items-start gap-2">
                        <span class="text-kapa shrink-0">{{ c.codigo }}</span>
                        <span class="text-dim flex-1">{{ c.nombre }}</span>
                        <span class="text-dim shrink-0" title="times ordered">×{{ c.veces }}</span>
                      </div>
                      <div v-if="r.candidatos[0].no_cubre.length" class="text-[10px] text-warn">
                        never covered: {{ r.candidatos[0].no_cubre.join(', ') }}
                      </div>
                    </div>
                    <div v-else class="text-[10px] text-dim mt-2">{{ r.motivo }}</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Product history -->

                <div v-else class="space-y-3">
                  <div v-for="(cols, tbl) in dbSchema.tablas" :key="tbl">
                    <button @click="sqlQuery.sql = 'SELECT * FROM ' + tbl"
                            class="font-mono text-[11px] text-kapa hover:underline text-left">{{ tbl }}</button>
                    <div class="text-[10px] font-mono text-dim leading-snug">{{ cols.map(c => c.columna).join(', ') }}</div>
                  </div>
                </div>
              </div>
            </div>
            <div v-if="sqlResult" class="text-[10px] text-dim">
              {{ sqlResult.total }} rows in {{ sqlResult.elapsed_ms }} ms
              <span v-if="sqlResult.truncado" class="text-warn">· truncated at the limit</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ========================================================== Modals -->
    <div v-if="showAddUserModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="bg-ink-900 border border-line p-6 rounded-2xl w-96">
        <h3 class="text-lg font-bold mb-5">Create user</h3>
        <div class="space-y-3">
          <input v-model="newUser.name" placeholder="Name" class="w-full bg-ink-950 border border-line rounded-lg p-2.5 text-sm focus:border-kapa outline-none">
          <input v-model="newUser.email" placeholder="Email" class="w-full bg-ink-950 border border-line rounded-lg p-2.5 text-sm focus:border-kapa outline-none">
          <input v-model="newUser.phone" placeholder="Phone (34600111222)" class="w-full bg-ink-950 border border-line rounded-lg p-2.5 text-sm focus:border-kapa outline-none">
          <select v-model="newUser.role" class="w-full bg-ink-950 border border-line rounded-lg p-2.5 text-sm focus:border-kapa outline-none">
            <option value="user">Salesman</option><option value="admin">Admin</option>
          </select>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button @click="showAddUserModal=false" class="px-4 py-2 text-dim hover:text-paper">Cancel</button>
          <button @click="createUser" class="bg-kapa text-kapa-ink px-4 py-2 rounded-lg font-bold hover:brightness-110">Create user</button>
        </div>
      </div>
    </div>

    <div v-if="showPairCodeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="bg-ink-900 border border-line p-8 rounded-2xl max-w-sm text-center">
        <h3 class="text-xl font-bold mb-2">Link WhatsApp device</h3>
        <p class="text-sm text-dim mb-6">In WhatsApp: Linked devices → Link with phone number → enter this code.</p>
        <div class="bg-ink-950 border border-line p-6 rounded-xl mb-6 min-h-[100px] flex items-center justify-center">
          <div v-if="pairCode" class="text-3xl font-mono font-bold tracking-[0.25em] text-kapa">{{ pairCode }}</div>
          <div v-else class="text-warn font-bold text-sm">Session already active — no code needed</div>
        </div>
        <button @click="showPairCodeModal=false" class="bg-kapa text-kapa-ink px-8 py-2.5 w-full rounded-xl font-bold hover:brightness-110">Done</button>
      </div>
    </div>

    <div v-if="showPasswordModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="bg-ink-900 border border-line p-6 rounded-2xl max-w-md w-full">
        <h3 class="text-lg font-bold mb-2">Gmail app password</h3>
        <p class="text-sm text-dim mb-5">16-character Google App Password for <b class="text-paper">{{ selectedUserForPassword?.email }}</b>.</p>
        <input v-model="newGmailPassword" type="text" placeholder="abcd efgh ijkl mnop" class="w-full bg-ink-950 border border-line rounded-lg p-3 text-sm font-mono focus:border-kapa outline-none">
        <div class="flex justify-end gap-3 mt-6">
          <button @click="showPasswordModal=false" class="px-4 py-2 text-dim hover:text-paper">Cancel</button>
          <button @click="saveGmailPassword" class="bg-kapa text-kapa-ink px-4 py-2 rounded-lg font-bold hover:brightness-110">Save password</button>
        </div>
      </div>
    </div>

    <!-- Toasts -->
    <div class="fixed bottom-4 right-4 z-50 space-y-2">
      <div v-for="t in toasts" :key="t.id" class="px-4 py-2.5 rounded-lg text-sm border shadow-lg font-medium"
           :class="t.type === 'error' ? 'bg-bad/10 border-bad/40 text-bad' : 'bg-kapa/10 border-kapa/40 text-kapa'">
        {{ t.text }}
      </div>
    </div>
  </template>
</div>
<script src="/static/app.js?v=3.2"></script>
</body>
</html>
