# Kapa: four services, no published ports except the admin API on localhost
# (reach it with: ssh -L 8000:localhost:8000 <server>).
#
# Local and server differ only in .env: KAPA_CHAT_MODEL=gemma-4-e2b on a small
# GPU, gemma-4-e4b on the server. Tachyon is built from ./tachyon (a copy).
name: kapa

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5

  meow_server:
    build: ./meow_server
    restart: unless-stopped
    env_file: .env
    environment:
      WHATSMEOW_HOST: 0.0.0.0
      WHATSMEOW_PORT: 50051
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 5s
      retries: 5

  tachyon:
    build:
      context: ./deploy/tachyon
      additional_contexts:
        tachyon_src: ./tachyon
    restart: unless-stopped
    environment:
      KAPA_CHAT_MODEL: ${KAPA_CHAT_MODEL:-gemma-4-e4b}
      KAPA_LAYA_MODEL: ${KAPA_LAYA_MODEL:-laya-multilingual}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - tachyon_models:/models
      - tachyon_run:/run/tachyon
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "tachyon", "ps"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1800s   # first start downloads the models

  chatlink_bot:
    build: ./chatlink_bot
    restart: unless-stopped
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      GRPC_HOST: meow_server
      GRPC_PORT: 50051
      POSTGRES_HOST: db
      TACHYON_BIN: /run/tachyon/tachyon
      TACHYON_SOCKET: /run/tachyon/tachyon.sock
    ports:
      - "127.0.0.1:${KAPA_API_PORT:-8000}:8000"
    volumes:
      - ./chatlink_bot/gmail_accounts.json:/app/gmail_accounts.json:ro
      - tachyon_run:/run/tachyon
    depends_on:
      db:
        condition: service_healthy
      meow_server:
        condition: service_healthy
      tachyon:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  tachyon_models:
  tachyon_run:
